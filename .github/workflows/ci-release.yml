name: CI & Cross-Platform Release

on:
  push:
    branches: [main, "arena/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (e.g. v1.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run C++ core unit tests
        run: |
          mkdir -p tests/bin
          gcc -O2 -DSQLITE_THREADSAFE=1 -c vendor/sqlite3/sqlite3.c -o tests/bin/sqlite3.o
          g++ -std=c++17 -O2 -Wall -Wextra -Isrc/core -Ivendor/sqlite3 \
            tests/test_core.cpp src/core/db.cpp tests/bin/sqlite3.o \
            -lpthread -ldl -o tests/bin/test_core
          ./tests/bin/test_core
      - name: Run UI, Jalali & i18n tests
        run: node tests/test_ui.cjs
      - name: Cross-compile Windows x64 portable & setup via Zig
        run: |
          python3 -m pip install --quiet ziglang
          ZIG_BIN="$(python3 -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
          ZIG_BIN="$ZIG_BIN" bash scripts/build_windows.sh
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: TypeCount-windows-x64
          path: releases/TypeCount-v*-windows-x64-*.exe

  build-windows-msi:
    needs: test-core-and-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TypeCount-windows-x64
          path: releases
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build & verify TypeCount Windows MSI
        shell: pwsh
        run: |
          $hdr = Get-Content src/core/version.hpp -Raw
          if ($hdr -match '#define TC_VERSION_STR\s+"([^"]+)"') { $ver3 = $Matches[1] } else { $ver3 = "1.2.0" }
          if ($hdr -match '#define TC_VERSION_STR_4\s+"([^"]+)"') { $ver4 = $Matches[1] } else { $ver4 = "1.2.0.0" }
          $srcExe = "releases\TypeCount-v$ver3-windows-x64-portable.exe"
          $outMsi = "releases\TypeCount-v$ver3-windows-x64-setup.msi"
          Write-Host "Building TypeCount MSI version $ver4 from $srcExe"
          $wixOut = & wix build installer/TypeCount.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d "AppVersion=$ver4" `
            -d "SourceExe=$srcExe" `
            -o $outMsi 2>&1
          $wixOut | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $outMsi)) {
            $errLine = ($wixOut | Out-String) -replace "`r?`n", " | "
            Write-Host "::error::$errLine"
            throw "MSI build failed with exit $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force -Path msi_verify | Out-Null
          $msiPath = (Resolve-Path $outMsi).Path
          $targetDir = (Resolve-Path msi_verify).Path
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msiPath`" /qn TARGETDIR=`"$targetDir`" /l*v msi_admin.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $logTail = (Get-Content msi_admin.log -Tail 30 | Out-String) -replace "`r?`n", " | "
            Write-Host "::error::msiexec exited $($p.ExitCode): $logTail"
            throw "msiexec admin unpack exited $($p.ExitCode)"
          }
          Get-ChildItem -Recurse msi_verify -Filter TypeCount.exe | Select-Object FullName, Length
          Remove-Item -Recurse -Force msi_verify, msi_admin.log -ErrorAction SilentlyContinue
      - name: Upload Windows Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TypeCount-windows-release
          path: releases/TypeCount-v*-windows-x64-*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux GTK3 / WebKit2GTK / XInput2 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxi-dev libx11-dev libxrandr-dev
      - name: Build & package Linux x64 portable .tar.gz and .deb
        run: |
          set +e
          bash scripts/build_linux.sh > linux_build.log 2>&1
          RC=$?
          cat linux_build.log
          if [ "$RC" -ne 0 ]; then
            ERR=$(tail -n 30 linux_build.log | tr '\n' '|' | sed 's/|/ | /g')
            echo "::error::$ERR"
            exit "$RC"
          fi
          rm -f linux_build.log
          dpkg-deb -I releases/TypeCount-v*-linux-x64-setup.deb
          dpkg-deb -c releases/TypeCount-v*-linux-x64-setup.deb
          tar -tzf releases/TypeCount-v*-linux-x64-portable.tar.gz
      - name: Upload Linux Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TypeCount-linux-release
          path: releases/TypeCount-v*-linux-x64-*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build & package macOS Universal (.zip & .dmg)
        run: |
          set +e
          bash scripts/build_macos.sh > macos_build.log 2>&1
          RC=$?
          cat macos_build.log
          if [ "$RC" -ne 0 ]; then
            ERR=$(tail -n 30 macos_build.log | tr '\n' '|' | sed 's/|/ | /g')
            echo "::error::$ERR"
            exit "$RC"
          fi
          rm -f macos_build.log
          lipo -archs tests/bin/macos_obj/TypeCount.app/Contents/MacOS/TypeCount
          codesign --verify --deep --strict tests/bin/macos_obj/TypeCount.app
          hdiutil verify releases/TypeCount-v*-macos-universal-setup.dmg
      - name: Upload macOS Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TypeCount-macos-release
          path: releases/TypeCount-v*-macos-universal-*

  publish-release:
    needs: [test-core-and-ui, build-windows-msi, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TypeCount-windows-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: TypeCount-linux-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: TypeCount-macos-release
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          shopt -s nullglob
          ASSETS=(release-assets/TypeCount-v*)
          ls -lh "${ASSETS[@]}"
          if gh release view "$REL_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" -R "${{ github.repository }}" "${ASSETS[@]}" --clobber
          else
            gh release create "$REL_TAG" -R "${{ github.repository }}" "${ASSETS[@]}" \
              --target main \
              --title "TypeCount $REL_TAG" \
              --generate-notes
          fi
